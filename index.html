<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno Jurídico v11 — biblioteca e construtor de resumos</title>
<meta name="description" content="Biblioteca visual completa e construtor local de resumos jurídicos em páginas A4 e 4:3.">
<meta name="author" content="Lana">
<meta name="theme-color" content="#071427">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alex+Brush&family=Allura&family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Bungee&family=Bungee+Shade&family=Caveat:wght@400;600;700&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=DM+Mono:wght@400;500&family=Dancing+Script:wght@500;600;700&family=Fredoka:wght@500;600;700&family=Great+Vibes&family=Kalam:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,500;0,700;1,600&family=Marck+Script&family=Monoton&family=Montserrat:wght@400;600;700;800;900&family=Nunito:wght@500;700;800;900&family=Orbitron:wght@500;600;700;800&family=Oswald:wght@400;500;600;700&family=Patrick+Hand&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Poiret+One&family=Press+Start+2P&family=Raleway:wght@400;500;600;700;800&family=Roboto+Slab:wght@500;700;900&family=Rock+Salt&family=Sacramento&family=Satisfy&family=Shadows+Into+Light&family=Special+Elite&family=UnifrakturCook:wght@700&family=Yeseva+One&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>

  :root{
    --bg:#050b17;
    --bg2:#0b1630;
    --panel:rgba(10,18,36,.78);
    --panel-2:rgba(16,26,48,.68);
    --stroke:rgba(125,211,252,.18);
    --stroke-2:rgba(167,139,250,.28);
    --paper:#f6fbff;
    --paper-warm:#f6fbff;
    --paper-2:#eef6ff;
    --line:#d9e5f2;
    --rule:rgba(97,141,184,.12);
    --ink:#122033;
    --ink2:#5c6c83;
    --ink3:#8aa0bf;
    --shadow:0 24px 60px rgba(0,0,0,.35);
    --glow:0 0 0 1px rgba(125,211,252,.18),0 0 30px rgba(56,189,248,.14),0 18px 40px rgba(5,9,20,.45);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    min-height:100vh;
    color:#e6f1ff;
    font-family:'Nunito',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(circle at 14% 18%, rgba(34,211,238,.18), transparent 22%),
      radial-gradient(circle at 82% 11%, rgba(139,92,246,.22), transparent 24%),
      radial-gradient(circle at 72% 78%, rgba(96,165,250,.16), transparent 26%),
      linear-gradient(135deg,#030712 0%, #071427 45%, #0a1731 100%);
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
    background-size:26px 26px;
    mask-image:radial-gradient(circle at center, black 52%, transparent 100%);
  }
  button,input,select{font:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{
    outline:2px solid rgba(125,211,252,.85);outline-offset:2px;
  }
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
  .skip-link{position:fixed;left:16px;top:12px;z-index:100;padding:10px 14px;border-radius:12px;text-decoration:none;font-weight:900;letter-spacing:.4px;color:#04111f;background:linear-gradient(135deg,#67e8f9,#a78bfa);transform:translateY(-180%);transition:transform .18s ease,box-shadow .18s ease;box-shadow:0 10px 24px rgba(0,0,0,.25)}
  .skip-link:focus{transform:translateY(0)}

  .app-shell{display:grid;grid-template-columns:330px 1fr;min-height:100vh;gap:28px;padding:22px}
  .topbar{
    position:sticky;top:22px;height:calc(100vh - 44px);z-index:20;
    display:flex;flex-direction:column;gap:16px;padding:22px 18px 18px;
    background:linear-gradient(180deg,rgba(11,20,40,.84),rgba(7,14,28,.72));
    border:1px solid var(--stroke);border-radius:28px;box-shadow:var(--glow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    overflow:hidden;
  }
  .topbar::before,.topbar::after{content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(10px);opacity:.55}
  .topbar::before{width:110px;height:110px;top:-36px;right:-28px;background:radial-gradient(circle,rgba(34,211,238,.55),transparent 72%)}
  .topbar::after{width:120px;height:120px;bottom:-40px;left:-35px;background:radial-gradient(circle,rgba(139,92,246,.48),transparent 72%)}

  .brand-wrap{position:relative;display:grid;gap:10px;padding:18px;border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(125,211,252,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 34px rgba(0,0,0,.18)}
  .brand-wrap::before{content:"";position:absolute;inset:0;border-radius:22px;padding:1px;background:linear-gradient(135deg,rgba(34,211,238,.6),rgba(167,139,250,.4),transparent 60%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .brand-mark{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#f8fbff;font-family:'Nunito',sans-serif;font-size:28px;font-weight:900;box-shadow:0 0 24px rgba(56,189,248,.34),0 8px 20px rgba(3,9,20,.35)}
  .brand{font-family:'Nunito',sans-serif;font-size:27px;font-weight:900;line-height:1;color:#f8fbff;letter-spacing:-.04em}
  .brand b{display:block;margin-top:8px;font-size:11px;font-weight:800;letter-spacing:2.6px;text-transform:uppercase;color:#92a9ca}
  .brand-note{margin:0;color:#a8b7cf;font-size:13px;line-height:1.45}
  .nav-title,.control-title{font-size:11px;font-weight:900;letter-spacing:2.4px;text-transform:uppercase;color:#7f95b8;padding:0 6px}
  #nav{display:flex;flex-direction:column;gap:7px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:140px;padding:2px 4px 6px;scrollbar-width:thin;scrollbar-color:rgba(125,211,252,.32) transparent}
  #nav::-webkit-scrollbar{width:6px}
  #nav::-webkit-scrollbar-thumb{background:rgba(125,211,252,.28);border-radius:999px}
  #nav button{
    position:relative;width:100%;text-align:left;background:rgba(255,255,255,.03);color:#c6d3e8;
    border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:11px 13px;cursor:pointer;
    font-size:12.5px;font-weight:800;transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease;
  }
  #nav button:hover{transform:translateX(2px);background:rgba(255,255,255,.06);border-color:rgba(125,211,252,.22)}
  #nav button.on{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(139,92,246,.24));color:#fff;border-color:rgba(125,211,252,.38);box-shadow:0 0 0 1px rgba(125,211,252,.18),0 0 20px rgba(34,211,238,.14)}
  #nav button.on::after{content:"";position:absolute;right:11px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:#67e8f9;box-shadow:0 0 12px #67e8f9}
  .toolbar-actions{display:flex;flex-direction:column;gap:10px;width:100%}
  .searchbox{display:flex;align-items:center;width:100%;min-width:0;border-radius:14px;padding:2px 6px 2px 12px;background:rgba(248,252,255,.06);border:1px solid rgba(125,211,252,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .filterin,.bank-input,.bank-select{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#e6f1ff}
  .filterin{padding:10px 4px;font-size:13px;font-weight:700}
  .filterin::placeholder,.bank-input::placeholder{color:#7f95b8}
  .iconbtn{width:30px;height:30px;border:0;border-radius:10px;background:transparent;color:#9fb2cf;display:grid;place-items:center;cursor:pointer;transition:background .15s ease,color .15s ease}
  .iconbtn:hover{background:rgba(255,255,255,.08);color:#fff}
  .dots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:10px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(125,211,252,.12)}
  .dot{justify-self:center;width:26px;height:26px;padding:0;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.76);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 16px rgba(255,255,255,.04);transition:transform .16s ease,box-shadow .16s ease}
  .dot:hover{transform:scale(1.12)}
  .dot.on{box-shadow:0 0 0 2px rgba(125,211,252,.92),0 0 18px rgba(125,211,252,.28)}
  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tbtn,.bank-tool-btn,.bank-open{
    appearance:none;border:1px solid rgba(125,211,252,.18);border-radius:14px;padding:10px 12px;background:rgba(248,252,255,.06);
    color:#eef7ff;font-size:11.5px;font-weight:900;letter-spacing:.5px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease;
  }
  .tbtn:hover,.bank-tool-btn:hover,.bank-open:hover{transform:translateY(-1px);border-color:rgba(125,211,252,.34);box-shadow:0 10px 18px rgba(0,0,0,.18),0 0 14px rgba(34,211,238,.08)}
  .tbtn.primary,.bank-tool-btn.primary,.bank-open{background:linear-gradient(135deg,#22d3ee,#8b5cf6);border-color:transparent;color:#07111f;box-shadow:0 10px 24px rgba(56,189,248,.2),0 8px 20px rgba(5,11,23,.24)}
  .tbtn.primary:hover,.bank-tool-btn.primary:hover,.bank-open:hover{color:#07111f;filter:saturate(1.08)}
  .count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 6px;margin-left:5px;border-radius:999px;background:linear-gradient(135deg,#67e8f9,#a78bfa);color:#04111f;font-size:9px;font-weight:900}
  .tbtn:disabled{opacity:.55;cursor:wait}

  .workspace{min-width:0}
  .stage{max-width:1180px;margin:0 auto;padding:22px 8px 42px}
  .sheet{
    position:relative;min-height:calc(100vh - 44px);padding:38px 30px 32px 42px;overflow:hidden;
    border-radius:32px;border:1px solid rgba(125,211,252,.2);background:linear-gradient(180deg,var(--paper) 0%, var(--paper-2) 100%);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.85), 0 0 0 1px rgba(125,211,252,.08), 0 0 60px rgba(34,211,238,.08);
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--rule) 1px,transparent 1px),
      linear-gradient(90deg,var(--rule) 1px,transparent 1px),
      radial-gradient(circle at top right,rgba(34,211,238,.08),transparent 22%),
      radial-gradient(circle at bottom left,rgba(139,92,246,.08),transparent 22%),
      linear-gradient(180deg,var(--paper) 0%,var(--paper-2) 100%);
    background-size:100% 28px,28px 28px,100% 100%,100% 100%,100% 100%;
  }
  .sheet::before{content:"";position:absolute;inset:0;border-radius:32px;padding:1px;background:linear-gradient(140deg,rgba(34,211,238,.42),transparent 28%,transparent 72%,rgba(167,139,250,.42));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .sheet::after{content:"";position:absolute;inset:16px;border-radius:24px;border:1px dashed rgba(125,211,252,.12);pointer-events:none}
  .holes{position:absolute;left:14px;top:22px;bottom:22px;width:14px;display:flex;flex-direction:column;justify-content:space-evenly;z-index:2}
  .holes i{width:14px;height:14px;border-radius:50%;background:#dce8f8;border:1px solid rgba(17,36,58,.18);box-shadow:inset 0 1px 3px rgba(0,0,0,.18),0 0 10px rgba(34,211,238,.08)}

  .shead{position:relative;max-width:760px;margin:0 auto 28px;padding:8px 20px 16px;text-align:center;color:var(--ink)}
  .shead .t1{
    position:relative;display:inline-block;z-index:1;font-family:'Dancing Script',cursive;font-size:clamp(40px,5.9vw,68px);font-weight:700;line-height:.96;letter-spacing:-.04em;
    color:#071729;text-shadow:0 1px 0 #fff, 3px 4px 0 rgba(139,92,246,.18),0 0 18px rgba(34,211,238,.08);
  }
  .shead .t1 svg{position:absolute;left:-10px;right:-10px;bottom:-2px;height:22px;width:calc(100% + 20px);z-index:-1;opacity:.9}
  .shead .strip{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:999px;background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(139,92,246,.18));border:1px solid rgba(125,211,252,.24);font-size:13px;font-weight:800;letter-spacing:.9px;color:#3c4c67;text-transform:uppercase;box-shadow:0 8px 18px rgba(15,23,42,.06)}
  .spr{position:absolute;pointer-events:none;filter:drop-shadow(0 0 8px rgba(34,211,238,.12))}

  .grid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px}
  .grid::after{content:"";position:absolute;top:6px;bottom:6px;left:50%;width:1px;background:linear-gradient(180deg,transparent,rgba(125,211,252,.26),transparent);pointer-events:none}
  .grid.small{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid.small::after{display:none}
  .grid.wide{grid-template-columns:repeat(2,minmax(0,1fr))}

  .card{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:128px;padding:16px 14px 12px;
    background:rgba(255,255,255,.56);border:1px solid rgba(125,211,252,.14);border-radius:22px;
    text-align:center;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;
    box-shadow:0 12px 22px rgba(8,15,30,.05), inset 0 1px 0 rgba(255,255,255,.78);
  }
  .card:hover{transform:translateY(-3px);border-color:rgba(125,211,252,.28);background:rgba(255,255,255,.72);box-shadow:0 18px 30px rgba(8,15,30,.09),0 0 22px rgba(34,211,238,.05)}
  .card.is-picked{animation:picked .78s ease}
  .card[hidden]{display:none!important}
  @keyframes picked{0%,100%{box-shadow:0 12px 22px rgba(8,15,30,.05)}50%{transform:translateY(-5px) scale(1.01);box-shadow:0 0 0 2px rgba(125,211,252,.32),0 0 24px rgba(34,211,238,.18),0 18px 30px rgba(8,15,30,.09)}}
  .cin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:88px;width:100%;padding:4px 0 8px;overflow:hidden;color:var(--ink)}
  .cin svg{max-width:100%;height:auto}.cin>span{max-width:100%;overflow-wrap:anywhere}
  .clab{width:100%;padding-top:8px;border-top:1px dashed rgba(17,36,58,.12);font-size:10.5px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#6d7e97}
  .fav,.favx{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:12px;border:1px solid rgba(125,211,252,.18);display:grid;place-items:center;line-height:0;cursor:pointer;transition:transform .15s ease,opacity .15s ease,background .15s ease}
  .fav{background:rgba(255,255,255,.92);color:#c86a8a;opacity:0;z-index:3}
  .card:hover .fav{opacity:1}.fav:hover,.favx:hover{transform:scale(1.08)}
  .fav.on,.favx{opacity:1;background:linear-gradient(135deg,#fb7185,#f472b6);color:#fff;border-color:transparent;box-shadow:0 10px 18px rgba(244,114,182,.24)}
  .empty,.bank-empty,.no-results{grid-column:1/-1;text-align:center;padding:38px 16px;border:1px dashed rgba(125,211,252,.22);border-radius:22px;background:rgba(255,255,255,.55);color:#667996;font-weight:800}
  .genrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:0 0 20px}
  .genin{min-width:min(460px,80vw);padding:13px 18px;border:1px solid rgba(125,211,252,.28);border-radius:16px;background:rgba(255,255,255,.78);color:var(--ink);font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 18px rgba(15,23,42,.06)}
  .row{display:flex;align-items:center;gap:7px;justify-content:center}
  .scr{font-family:'Caveat',cursive;font-weight:700;line-height:.95}
  .dsc{font-family:'Dancing Script',cursive;font-weight:700;line-height:1}
  .cap{font-family:'Kalam',cursive;font-weight:700;line-height:1}
  .pat{font-family:'Patrick Hand',cursive;line-height:1}
  .lrow{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--ink);padding:3.5px 0;text-align:left}.lrow svg{flex:none}

  .legal-intro,.bank-summary,.idea-bank,.bank-toolbar,.bank-area{
    color:var(--ink);background:rgba(255,255,255,.6);border:1px solid rgba(125,211,252,.16);box-shadow:0 12px 22px rgba(8,15,30,.04), inset 0 1px 0 rgba(255,255,255,.7)
  }
  .legal-intro,.bank-summary{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;max-width:760px;margin:0 auto 22px;padding:16px 18px;border-radius:20px;font-size:14px;line-height:1.45;color:#5f718b}
  .legal-intro strong,.bank-summary strong{color:var(--ink)}
  .legal-seal,.bank-number{display:grid;place-items:center;background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#07111f;box-shadow:0 10px 22px rgba(56,189,248,.18)}
  .legal-seal{width:48px;height:48px;border-radius:16px;font-family:'Nunito',sans-serif;font-size:22px;font-weight:900}
  .legal-grid .card{min-height:146px}.legal-grid .cin{min-height:100px}
  .idea-bank{position:relative;margin:28px 8px 6px;padding:22px 20px 18px;border-radius:20px}
  .idea-bank::before{content:"Banco de títulos";position:absolute;top:-12px;left:22px;padding:6px 12px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#07111f;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
  .idea-bank-preview{display:flex;flex-direction:column;gap:14px}
  .idea-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 14px}
  .idea-chip{display:flex;align-items:flex-start;gap:8px;color:var(--ink);font-size:14px;line-height:1.2}.idea-chip::before{content:"✦";color:#8b5cf6;font-weight:900;transform:translateY(1px)}
  .idea-bank-actions{display:flex;justify-content:center;margin-top:4px}

  .bank-summary strong{display:block;font-size:17px;margin-bottom:2px}
  .bank-number{min-width:62px;height:62px;padding:0 8px;border-radius:18px;font-family:'Nunito',sans-serif;font-size:18px;font-weight:900}
  .bank-toolbar{display:grid;grid-template-columns:minmax(220px,1.4fr) minmax(190px,1fr) auto auto;gap:10px;align-items:center;margin:0 0 18px;padding:14px;border-radius:20px}
  .bank-input,.bank-select{padding:11px 12px;border:1px solid rgba(125,211,252,.18);border-radius:14px;background:rgba(8,18,34,.06);color:var(--ink);font-size:14px;font-weight:700}
  .bank-select option{color:#07111f}
  .bank-result-note{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 4px 14px;color:#60728e;font-size:13px;font-weight:700}.bank-result-note strong{color:#33496a}
  .bank-areas{display:grid;gap:18px}
  .bank-area{position:relative;padding:18px 18px 16px;border-radius:22px;break-inside:avoid}.bank-area[hidden]{display:none!important}
  .bank-area-head{display:flex;align-items:center;gap:10px;margin:0 0 14px}.bank-area-mark{min-width:40px;height:34px;padding:0 7px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#07111f;font-size:10px;font-weight:900;letter-spacing:.5px}
  .bank-area-title{font-family:'Nunito',sans-serif;font-size:20px;line-height:1;color:var(--ink);font-weight:900;letter-spacing:-.03em}.bank-area-count{margin-left:auto;font-size:10px;font-weight:900;color:#7e90aa;letter-spacing:1px;text-transform:uppercase}
  .bank-title-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
  .bank-title{position:relative;width:100%;min-height:38px;border:1px solid transparent;background:rgba(8,18,34,.03);color:var(--ink);padding:9px 34px 9px 12px;text-align:left;font-size:14px;font-weight:700;line-height:1.15;cursor:pointer;border-radius:14px;transition:background .14s ease,transform .14s ease,border-color .14s ease}
  .bank-title::before{content:'✦';margin-right:7px;color:#8b5cf6;font-weight:900}
  .bank-title::after{content:'usar';position:absolute;right:11px;top:50%;transform:translateY(-50%);font-family:'Nunito',sans-serif;font-size:8px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:#8aa0bf;opacity:0}
  .bank-title:hover,.bank-title:focus-visible{background:rgba(34,211,238,.08);border-color:rgba(125,211,252,.18);transform:translateX(2px)}
  .bank-title:hover::after,.bank-title:focus-visible::after{opacity:1;color:#5e7eff}.bank-title[hidden]{display:none!important}

async function sha256Json(value){
  if(!window.crypto||!window.crypto.subtle)return null;
  var bytes=new TextEncoder().encode(JSON.stringify(value));
  var digest=await window.crypto.subtle.digest('SHA-256',bytes);
  return Array.from(new Uint8Array(digest)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
}

function sanitizeLegacyFragment(html,instanceId){
  var template=document.createElement('template'),warnings=[],scope=String(instanceId||'legacy').replace(/[^a-z0-9_-]/gi,'-');
  template.innerHTML=String(html||'');
  var allowedTags=new Set(['SPAN','DIV','SVG','DEFS','PATTERN','USE','PATH','CIRCLE','ELLIPSE','RECT','LINE','POLYLINE','POLYGON','TEXT','TEXTPATH','G','I','B','STRONG','EM','SMALL','BR']);
  var dangerousTags=new Set(['SCRIPT','FOREIGNOBJECT','IFRAME','OBJECT','EMBED','STYLE','LINK','META','FORM','INPUT','BUTTON','IMG','VIDEO','AUDIO']);
  var allowedAttrs=new Set(['class','role','aria-hidden','id','viewbox','width','height','x','y','x1','x2','y1','y2','cx','cy','r','rx','ry','d','points','fill','stroke','stroke-width','stroke-linecap','stroke-linejoin','transform','patternunits','patterntransform','style','href','xlink:href','opacity','text-anchor','font-family','font-size','font-weight','letter-spacing','dy','startoffset','preserveaspectratio']);
  var idMap=new Map();
  [].slice.call(template.content.querySelectorAll('[id]')).forEach(function(element){
    var oldId=element.getAttribute('id'),newId=scope+'-'+String(oldId||'id').replace(/[^a-z0-9_-]/gi,'-');
    idMap.set(oldId,newId);element.setAttribute('id',newId);
  });
  [].slice.call(template.content.querySelectorAll('*')).reverse().forEach(function(element){
    var tagName=String(element.tagName||'').toUpperCase();
    if(dangerousTags.has(tagName)){warnings.push('removed:'+tagName.toLowerCase());element.remove();return;}
    if(!allowedTags.has(tagName)){
      warnings.push('unwrapped:'+element.tagName.toLowerCase());
      element.replaceWith.apply(element,[].slice.call(element.childNodes));return;
    }
    [].slice.call(element.attributes).forEach(function(attribute){
      var name=attribute.name.toLowerCase(),value=attribute.value;
      if(/^on/i.test(name)||!allowedAttrs.has(name)){element.removeAttribute(attribute.name);warnings.push('attribute:'+name);return;}
      if(name==='style'&&/(?:url\s*\(|expression\s*\(|@import|javascript:|data:|-moz-binding)/i.test(value)){element.removeAttribute(attribute.name);warnings.push('style');return;}
      if(name==='href'||name==='xlink:href'){
        if(value.charAt(0)!=='#'||!idMap.has(value.slice(1))){element.removeAttribute(attribute.name);warnings.push('href');}
        else element.setAttribute(attribute.name,'#'+idMap.get(value.slice(1)));
        return;
      }
      if(/javascript:|data:text\/html|expression\s*\(|-moz-binding/i.test(value)){element.removeAttribute(attribute.name);warnings.push('value:'+name);}
    });
  });
  var holder=document.createElement('div');holder.appendChild(template.content.cloneNode(true));
  return {html:holder.innerHTML,text:holder.textContent||'',warnings:warnings};
}
function stableTextDigest(value){
  var text=String(value==null?'':value),hash=2166136261;
  for(var i=0;i<text.length;i++){hash^=text.charCodeAt(i);hash=Math.imul(hash,16777619);}
  return ('00000000'+(hash>>>0).toString(16)).slice(-8)+':'+text.length;
}

  var bankQuery=typeof data.bankQuery==='string'?normalizeUserText(data.bankQuery).slice(0,70):'';if(data.bankQuery!=null&&typeof data.bankQuery!=='string')warn('bankQuery');
  var bankArea=data.bankArea==='todas'||LEGAL_TITLE_BANK.some(function(area){return area.id===data.bankArea;})?data.bankArea:'todas';if(data.bankArea!=null&&bankArea==='todas'&&data.bankArea!=='todas')warn('bankArea');

  var migration={sourceKey:sourceKey,digest:digest,migratedAt:now,favoriteCount:favorites.length,modelFavorites:favorites.filter(function(x){return x.kind==='model';}).length,legacyFavorites:favorites.filter(function(x){return x.kind==='legacy';}).length,warnings:warnings.length,preferences:{paletteId:paletteId,generatorText:generatorText,generatorMode:generatorMode,filter:filter,bankQuery:bankQuery,bankArea:bankArea,sheet:sheet}};

}
